# Crée la release GitHub (donc la nouvelle version DOI sur Zenodo) quand une
# étiquette vX.Y.Z est poussée. Les notes bilingues sont lues dans
# notes_de_version/<étiquette>.md ; le titre, dans sa première ligne « # ».
# Creates the GitHub release (hence the new Zenodo DOI version) when a vX.Y.Z
# tag is pushed. Bilingual notes come from notes_de_version/<tag>.md.
name: Release sur étiquette

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release / Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="notes_de_version/${TAG}.md"
          test -f "$NOTES" || { echo "Notes manquantes : $NOTES"; exit 1; }
          TITRE=$(grep -m1 '^# ' "$NOTES" | sed 's/^# //')
          tail -n +2 "$NOTES" > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà ; rien à faire."
          else
            gh release create "$TAG" --title "${TITRE:-The Blob Principle $TAG}" --notes-file /tmp/notes.md --verify-tag
          fi
